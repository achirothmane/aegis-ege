name: Frozen reproduction evidence

on:
  pull_request:
    paths:
      - 'experiments/precedence_repro/**'
      - 'scripts/run_independent_reproduction.py'
      - 'scripts/verify_frozen_reproduction.py'
      - 'scripts/test_verify_frozen_reproduction.py'
      - 'testdata/governed-action/kernel-shrink/independent-reproduction-v1.json'
      - 'docs/governed-action/kernel-shrink/cycle-8-replay-assurance.md'
      - '.github/workflows/frozen-reproduction-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/precedence_repro/**'
      - 'scripts/run_independent_reproduction.py'
      - 'scripts/verify_frozen_reproduction.py'
      - 'scripts/test_verify_frozen_reproduction.py'
      - 'testdata/governed-action/kernel-shrink/independent-reproduction-v1.json'
      - 'docs/governed-action/kernel-shrink/cycle-8-replay-assurance.md'
      - '.github/workflows/frozen-reproduction-evidence.yml'

permissions:
  contents: read

jobs:
  frozen-evidence-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install experiment-only signature dependency
        run: python -m pip install cryptography==46.0.0
      - name: Verify failure controls
        run: python -B -m unittest discover -s scripts -p 'test_verify_frozen_reproduction.py' -v
      - name: Execute unchanged producers and verify full frozen evidence
        run: |
          set -euo pipefail
          python -B scripts/run_independent_reproduction.py --out "$RUNNER_TEMP/frozen-evidence-replay"
          python -B scripts/verify_frozen_reproduction.py --evidence-dir "$RUNNER_TEMP/frozen-evidence-replay"
          git diff --exit-code
      - name: Preserve replay files and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-evidence-replay-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/frozen-evidence-replay/
