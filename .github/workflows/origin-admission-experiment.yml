name: Origin admission experiment

on:
  pull_request:
    paths:
      - ".github/workflows/origin-admission-experiment.yml"
      - "internal/originadmissionexperiment/**"
      - "testdata/governed-action/origin-admission/**"
      - "testdata/governed-action/v1/normative-cases.json"
      - "docs/governed-action/execution-origin-admission-experiment.md"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - ".github/workflows/origin-admission-experiment.yml"
      - "internal/originadmissionexperiment/**"
      - "testdata/governed-action/origin-admission/**"
      - "testdata/governed-action/v1/normative-cases.json"
      - "docs/governed-action/execution-origin-admission-experiment.md"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  origin-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Report Go formatting differences
        run: gofmt -d internal/originadmissionexperiment/*.go
      - name: Execute bounded origin admission traces with race detection
        run: go test -race -count=1 -v ./internal/originadmissionexperiment
