name: Governed history lineage succession proof

on:
  pull_request:
    paths:
      - "internal/journal/history_genesis_binding.go"
      - "internal/journal/history_lineage_succession.go"
      - "internal/journal/history_lineage_succession_test.go"
      - "internal/genesisbootstrap/verified_genesis_pin.go"
      - "internal/genesisbootstrap/verified_genesis_pin_test.go"
      - ".github/workflows/history-lineage-succession.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-succession:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - name: Prove governed cross-Genesis lineage succession
        run: |
          set -euo pipefail
          go test ./internal/journal ./internal/genesisbootstrap -run 'Test(GovernedHistoryLineageSuccession|HistoryLineageSuccession|ProductionGenesisPinBindsExactQuorumEnvelope|ProductionGenesisLockedDoesNotEmitVerifiedPin)' -count=1 -v | tee "$RUNNER_TEMP/history-lineage-succession.log"
          grep -q -- "--- PASS: TestGovernedHistoryLineageSuccessionCreatesBoundAnchor" "$RUNNER_TEMP/history-lineage-succession.log"
          grep -q -- "--- PASS: TestHistoryLineageSuccessionRejectsUnprovenPredecessor" "$RUNNER_TEMP/history-lineage-succession.log"
          grep -q -- "--- PASS: TestHistoryLineageSuccessionRequiresPredecessorOnNewGenesisQuorum" "$RUNNER_TEMP/history-lineage-succession.log"
          grep -q -- "--- PASS: TestHistoryLineageSuccessionRejectsConflictingSuccessorState" "$RUNNER_TEMP/history-lineage-succession.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/history-lineage-succession.log"; then
            exit 1
          fi
