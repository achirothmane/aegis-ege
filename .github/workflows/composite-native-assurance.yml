name: Composite native assurance and portable verifier

on:
  pull_request:
    paths:
      - 'evidenceverify/**'
      - 'cmd/aegis-evidence-inspect/**'
      - 'experiments/gosmig-simulation/**'
      - 'experiments/kernelshrink/**'
      - 'scripts/*kernel_shrink.py'
      - 'scripts/run_semantic_closure.py'
      - 'scripts/run_custody_elimination.py'
      - 'testdata/governed-action/kernel-shrink/**'
      - 'governedaction/**'
      - 'internal/journal/**'
      - 'internal/genesisbootstrap/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/composite-native-assurance.yml'
  push:
    branches: [main]
    paths:
      - 'evidenceverify/**'
      - 'cmd/aegis-evidence-inspect/**'
      - 'experiments/gosmig-simulation/**'
      - 'experiments/kernelshrink/**'
      - 'scripts/*kernel_shrink.py'
      - 'scripts/run_semantic_closure.py'
      - 'scripts/run_custody_elimination.py'
      - 'testdata/governed-action/kernel-shrink/**'
      - 'governedaction/**'
      - 'internal/journal/**'
      - 'internal/genesisbootstrap/**'
      - '.github/workflows/composite-native-assurance.yml'

permissions:
  contents: read

jobs:
  kernel-shrink:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - name: Verify immutable baselines, runtime reduction and test-only fixtures
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_verify*kernel*.py' -v
          python3 scripts/verify_kernel_shrink.py
          test -z "$(gofmt -l governedaction/*.go governedaction/runtime/runtime.go governedaction/runtime/recovery.go governedaction/runtime/fenced.go experiments/kernelshrink evidenceverify/shrink_test.go evidenceverify/semantic_closure_test.go)"
      - name: Differential replay and binding elimination counterexamples
        run: |
          set -euo pipefail
          python3 scripts/run_kernel_shrink.py --out "$RUNNER_TEMP/kernel-shrink"
          git diff --exit-code
      - name: Try live closure and custody merges on the actual evaluator
        run: |
          set -euo pipefail
          python3 scripts/run_semantic_closure.py --out "$RUNNER_TEMP/semantic-closure-unit"
          git diff --exit-code
      - name: Preserve reduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-shrink-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/kernel-shrink/
            ${{ runner.temp }}/semantic-closure-unit/

  composite-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16.6@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: gosmig_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gosmig_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOSMIG_SIM_ADMIN_DSN: postgres://postgres:fixture-only@localhost:5432/gosmig_fixture?sslmode=disable
      NATIVE_FENCE_REQUIRE: '1'
      COMPOSITE_REQUIRE: '1'
      COMPOSITE_SUCCESSION_REQUIRE: '1'
      COMPOSITE_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false

      - name: Select local evidence paths
        run: |
          echo "EVIDENCE_VERIFY_BINARY=$RUNNER_TEMP/aegis-evidence-inspect" >> "$GITHUB_ENV"
          echo "COMPOSITE_ARTIFACT_DIR=$RUNNER_TEMP/composite-evidence" >> "$GITHUB_ENV"
          echo "COMPOSITE_NATIVE_BINARY=$RUNNER_TEMP/composite-native.test" >> "$GITHUB_ENV"
          echo "COMPOSITE_GENESIS_INPUT=$RUNNER_TEMP/composite-genesis-input.json" >> "$GITHUB_ENV"
          echo "COMPOSITE_GENESIS_FIXTURE_DIR=$RUNNER_TEMP/composite-genesis" >> "$GITHUB_ENV"
          echo "COMPOSITE_SUCCESSION_KEYS=$RUNNER_TEMP/composite-private-keys.json" >> "$GITHUB_ENV"

      - name: Verify portable evaluator and build read-only consumer
        run: |
          set -euo pipefail
          mkdir -p "$COMPOSITE_ARTIFACT_DIR"
          test "$(git rev-parse HEAD)" = "$COMPOSITE_BUILD_SHA"
          test -z "$(gofmt -l evidenceverify cmd/aegis-evidence-inspect experiments/gosmig-simulation/*succession*test.go experiments/gosmig-simulation/composite_native_test.go experiments/gosmig-simulation/semantic_closure_test.go experiments/gosmig-simulation/custody_elimination*test.go experiments/gosmig-simulation/native_destination_fence_test.go internal/genesisbootstrap/composite_fixture_export_test.go)"
          go test -race -mod=readonly -count=1 ./evidenceverify ./cmd/aegis-evidence-inspect | tee "$COMPOSITE_ARTIFACT_DIR/unit.log"
          go build -mod=readonly -trimpath -o "$EVIDENCE_VERIFY_BINARY" ./cmd/aegis-evidence-inspect
          # This production binary may depend only on the standard library and
          # the evaluator, not the runtime, adapters or journal producer.
          go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/aegis-evidence-inspect > "$COMPOSITE_ARTIFACT_DIR/verifier-dependencies.txt"
          ! grep -E 'internal/|governedaction/|pgx|k8s.io' "$COMPOSITE_ARTIFACT_DIR/verifier-dependencies.txt"
          sha256sum "$EVIDENCE_VERIFY_BINARY" > "$COMPOSITE_ARTIFACT_DIR/verifier-binary.sha256"

      - name: Prepare signed Genesis for the exact native executable
        run: |
          set -euo pipefail
          (cd experiments/gosmig-simulation && go mod download && go mod verify && go test -race -mod=readonly -c -o "$COMPOSITE_NATIVE_BINARY" .)
          COMPOSITE_PREPARE_SUCCESSION=1 "$COMPOSITE_NATIVE_BINARY" -test.run '^TestPostgresCompositePrepareSuccession$' -test.v
          go test -mod=readonly -count=1 -run '^TestCompositeGenesisFixtureExport$' ./internal/genesisbootstrap
          sha256sum "$COMPOSITE_NATIVE_BINARY" > "$COMPOSITE_ARTIFACT_DIR/native-binary.sha256"
          # Private signing keys, bootstrap paths and credentials stay outside
          # the uploaded directory. Bundles contain only portable public proof.

      - name: Execute native crash, authority, recovery and causality corpus
        working-directory: experiments/gosmig-simulation
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go tool test2json -t -p github.com/achirothmane/aegis-ege/experiments/gosmig-simulation "$COMPOSITE_NATIVE_BINARY" -test.v -test.run '^TestPostgresComposite' -test.timeout=5m | tee "$COMPOSITE_ARTIFACT_DIR/native-tests.jsonl"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = [json.loads(line) for line in Path(os.environ['COMPOSITE_ARTIFACT_DIR'], 'native-tests.jsonl').read_text().splitlines()]
          assert not any(r['Action'] == 'skip' for r in rows), 'native case skipped'
          expected = {
              'TestPostgresCompositeLostAcknowledgementAuthorityChangeRecovery/CLOSED',
              'TestPostgresCompositeLostAcknowledgementAuthorityChangeRecovery/UNKNOWN',
              'TestPostgresCompositeAuthorityGenerationSwitchDoesNotReviveOldAdmission',
              'TestPostgresCompositeMatchingStateAndForeignEffectDoNotProveCausality',
              'TestPostgresCompositeGenesisHistoryCustodianLostAcknowledgement/CLOSED',
              'TestPostgresCompositeGenesisHistoryCustodianLostAcknowledgement/UNKNOWN',
              'TestPostgresCompositeSemanticClosurePairs/owned',
              'TestPostgresCompositeSemanticClosurePairs/foreign-attempt',
              'TestPostgresCompositeSemanticClosurePairs/changed-postcondition',
              'TestPostgresCompositeNoCustodyCrashRecovery/CLOSED',
              'TestPostgresCompositeNoCustodyCrashRecovery/UNKNOWN',
              'TestPostgresCompositeNoCustodyCrashRecovery/PRE_COMMIT',
              'TestPostgresCompositeNoCustodyReplayRetention',
              'TestPostgresCompositeNoCustodyConcurrentSuccessors',
              'TestPostgresCompositeNoCustodyHistoricalCompletionDoesNotCloseDrift',
          }
          passed = {r.get('Test') for r in rows if r['Action'] == 'pass'}
          assert expected <= passed, (expected - passed)
          PY

      - name: Falsify live merges in the read-only consumer using native effects
        run: |
          set -euo pipefail
          python3 scripts/run_semantic_closure.py --out "$COMPOSITE_ARTIFACT_DIR/live-semantic-reduction" --native-test-binary "$COMPOSITE_NATIVE_BINARY"
          git diff --exit-code

      - name: Try custody elimination and falsify erasure of native completion retention
        run: |
          set -euo pipefail
          python3 scripts/run_custody_elimination.py --out "$COMPOSITE_ARTIFACT_DIR/live-custody-reduction" --native-test-binary "$COMPOSITE_NATIVE_BINARY"
          git diff --exit-code

      - name: Preserve executable pre-fix claim-downgrade counterexample
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:evidenceverify/verify.go" > "$RUNNER_TEMP/base-verify.go"
          if grep -q 'a.p.RequiredClaimType' "$RUNNER_TEMP/base-verify.go"; then
            echo 'Baseline already enforces the independent claim obligation.' > "$COMPOSITE_ARTIFACT_DIR/claim-baseline.txt"
            exit 0
          fi
          # Keep the additive policy field/test fixture, then run the actual
          # previous evaluator. It must not be able to ignore the obligation.
          cp evidenceverify/verify.go "$RUNNER_TEMP/current-verify.go"
          trap 'cp "$RUNNER_TEMP/current-verify.go" evidenceverify/verify.go' EXIT
          cp "$RUNNER_TEMP/base-verify.go" evidenceverify/verify.go
          set +e
          go test -race -mod=readonly -count=1 -v -run '^TestIndependentPolicyRejectsBundleClaimDowngrade$' ./evidenceverify > "$COMPOSITE_ARTIFACT_DIR/claim-baseline.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'bundle-selected postcondition satisfied the independent exact-effect obligation:' "$COMPOSITE_ARTIFACT_DIR/claim-baseline.log"
          grep -q 'Closure:CLOSED.*ClaimsSupported:true' "$COMPOSITE_ARTIFACT_DIR/claim-baseline.log"

      - name: Preserve executable pre-fix authority counterexample
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        working-directory: experiments/gosmig-simulation
        run: |
          set -euo pipefail
          # The same regression is run against the actual previous adapter.
          # Once the invariant is already on main, the baseline is satisfied.
          git show "$BASE_SHA:experiments/gosmig-simulation/native_destination_fence_test.go" > "$RUNNER_TEMP/base-native.go"
          if grep -q 'expectedAuthorityGeneration' "$RUNNER_TEMP/base-native.go"; then
            echo 'Baseline already enforces the authority-generation invariant.' > "$COMPOSITE_ARTIFACT_DIR/baseline.txt"
            exit 0
          fi
          cp native_destination_fence_test.go "$RUNNER_TEMP/current-native.go"
          trap 'cp "$RUNNER_TEMP/current-native.go" native_destination_fence_test.go' EXIT
          cp "$RUNNER_TEMP/base-native.go" native_destination_fence_test.go
          set +e
          go test -race -mod=readonly -count=1 -v -run '^TestPostgresCompositeAuthorityGenerationSwitchDoesNotReviveOldAdmission$' . > "$COMPOSITE_ARTIFACT_DIR/baseline.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'old admission crossed a new authority generation: disposition=CLOSED effects=1' "$COMPOSITE_ARTIFACT_DIR/baseline.log"

      - name: Preserve enrollment and authority-reset counterexamples
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "$BASE_SHA:internal/journal/quorum_head_store.go" > "$RUNNER_TEMP/base-quorum.go"
          git show "$BASE_SHA:internal/journal/successor_governance_rotation.go" > "$RUNNER_TEMP/base-successor.go"
          if grep -q 'FileJournal names the selected identity' "$RUNNER_TEMP/base-quorum.go" && grep -q 'Validate every readable retained head' "$RUNNER_TEMP/base-successor.go"; then
            echo 'Baseline already enforces exact enrollment and retained authority.' > "$COMPOSITE_ARTIFACT_DIR/quorum-baseline.txt"
            exit 0
          fi
          cp internal/journal/quorum_head_store.go "$RUNNER_TEMP/current-quorum.go"
          cp internal/journal/successor_governance_rotation.go "$RUNNER_TEMP/current-successor.go"
          trap 'cp "$RUNNER_TEMP/current-quorum.go" internal/journal/quorum_head_store.go; cp "$RUNNER_TEMP/current-successor.go" internal/journal/successor_governance_rotation.go' EXIT
          cp "$RUNNER_TEMP/base-quorum.go" internal/journal/quorum_head_store.go
          cp "$RUNNER_TEMP/base-successor.go" internal/journal/successor_governance_rotation.go
          set +e
          go test -race -mod=readonly -count=1 -run '^Test(Quorum(FileJournalEnrollmentPreservesRetainedIdentity|RejectsMalformedNonexistentPredecessor)|SuccessorInitialization)' ./internal/journal > "$COMPOSITE_ARTIFACT_DIR/quorum-baseline.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -q 'anchored journal cannot enroll through existing quorum relation' "$COMPOSITE_ARTIFACT_DIR/quorum-baseline.log"
          grep -q 'nonzero nonexistent predecessor accepted' "$COMPOSITE_ARTIFACT_DIR/quorum-baseline.log"
          grep -q 'current majority omitted readable Genesis seed' "$COMPOSITE_ARTIFACT_DIR/quorum-baseline.log"
          grep -q 'initialization reset retained JOINT_FROZEN:.*old_authority_current=true' "$COMPOSITE_ARTIFACT_DIR/quorum-baseline.log"

      - name: Preserve evidence and fixture-only policy channel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composite-native-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/composite-evidence/
