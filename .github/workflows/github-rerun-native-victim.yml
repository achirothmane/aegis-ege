name: GitHub Rerun Native Victim

on:
  pull_request:
    paths:
      - 'governedaction/**'
      - 'internal/governedactionnormative/**'
      - 'internal/kubeadapter/**'
      - 'experiments/gosmig-simulation/**'
      - 'cmd/github-rerun-proof/**'
      - 'testdata/governed-action/**'
      - '.github/workflows/cross-domain-kernel-proof.yml'
      - '.github/workflows/github-rerun-native-victim.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  victim:
    runs-on: ubuntu-latest
    steps:
      - name: Fail first attempt, pass rerun
        shell: bash
        run: |
          echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT sha=$GITHUB_SHA"
          if [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
            echo "intentional first-attempt failure for native rerun proof"
            exit 73
          fi
          echo "rerun observed; victim passes on attempt $GITHUB_RUN_ATTEMPT"
