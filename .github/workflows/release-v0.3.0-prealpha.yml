name: Release v0.3.0-prealpha

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-v0.3.0-prealpha.yml"
      - ".release/v0.3.0-prealpha.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build source release asset
        run: |
          git archive \
            --format=tar.gz \
            --prefix=aegis-ege-v0.3.0-prealpha/ \
            --output=aegis-ege-v0.3.0-prealpha-source.tar.gz \
            "$GITHUB_SHA"
          sha256sum aegis-ege-v0.3.0-prealpha-source.tar.gz \
            > aegis-ege-v0.3.0-prealpha-source.tar.gz.sha256

      - name: Create GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-prealpha >/dev/null 2>&1; then
            echo "v0.3.0-prealpha already exists"
            exit 0
          fi

          gh release create v0.3.0-prealpha \
            aegis-ege-v0.3.0-prealpha-source.tar.gz \
            aegis-ege-v0.3.0-prealpha-source.tar.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Aegis-EGE v0.3.0-prealpha" \
            --notes-file .release/v0.3.0-prealpha.md \
            --prerelease
