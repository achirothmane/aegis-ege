name: Runtime exact binding proof

on:
  pull_request:
    paths:
      - 'governedaction/runtime/**'
      - '.github/workflows/runtime-binding-proof.yml'

permissions:
  contents: read

jobs:
  bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: governedaction
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Confirm regression fails on original encoding
        run: |
          cp runtime/runtime.go "$RUNNER_TEMP/runtime-fixed.go"
          trap 'cp "$RUNNER_TEMP/runtime-fixed.go" runtime/runtime.go' EXIT
          git show 157d713e8ce9d760296b08ecccc0bd87f1413ea8:governedaction/runtime/runtime.go > runtime/runtime.go
          if go test ./runtime -run '^Test(OpaqueFieldBoundariesRemainDistinct|ExactBindingAtAdmissionAndClosureBoundaries) -count=1 > "$RUNNER_TEMP/runtime-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/runtime-baseline.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/runtime-baseline.log"
          grep -q 'distinct subject fields share an effect binding' "$RUNNER_TEMP/runtime-baseline.log"
          grep -q 'foreign admission must be rejected' "$RUNNER_TEMP/runtime-baseline.log"
          grep -q 'foreign observation must leave UNKNOWN' "$RUNNER_TEMP/runtime-baseline.log"
      - name: Verify corrected bindings and full library
        run: go test -race -count=1 -v ./...
 -count=1 > "$RUNNER_TEMP/runtime-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/runtime-baseline.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/runtime-baseline.log"
          grep -q 'distinct subject fields share an effect binding' "$RUNNER_TEMP/runtime-baseline.log"
      - name: Verify corrected bindings and full library
        run: go test -race -count=1 -v ./...
