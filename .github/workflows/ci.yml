name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Resolve modules
        run: |
          go mod tidy
          echo "=== GO_SUM_BEGIN ==="
          cat go.sum
          echo "=== GO_SUM_END ==="

      - name: Test
        run: go test ./...
