name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Download modules
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "module download failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify modules
        run: go mod verify

      - name: Test
        run: go test ./...
