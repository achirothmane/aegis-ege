name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - run: go mod verify
      - name: Compile kernel BPF adapters
        run: |
          ARCH_INCLUDE="/usr/include/$(uname -m)-linux-gnu"
          clang -O2 -g -Wall -Werror -target bpf \
            -I"$ARCH_INCLUDE" \
            -Ikernel/bpf \
            -c kernel/bpf/aegis_connect.bpf.c \
            -o "$RUNNER_TEMP/aegis_connect.bpf.o"
          clang -O2 -g -Wall -Werror -target bpf \
            -I"$ARCH_INCLUDE" \
            -Ikernel/bpf \
            -c kernel/bpf/aegis_taint.bpf.c \
            -o "$RUNNER_TEMP/aegis_taint.bpf.o"
      - name: Verify taint hardening formatting
        run: |
          offenders="$(gofmt -l internal/kernelfabric/taint_*.go cmd/aegis-taint-*/main.go)"
          if [ -n "$offenders" ]; then
            echo "gofmt required for:"
            printf '%s\n' "$offenders"
            gofmt -d internal/kernelfabric/taint_*.go cmd/aegis-taint-*/main.go
            exit 1
          fi
      - name: Assert legacy unsigned BPF loader is disabled
        run: |
          if bash kernel/bpf/load.sh >"$RUNNER_TEMP/legacy-loader.out" 2>&1; then
            echo "legacy unsigned loader unexpectedly succeeded"
            cat "$RUNNER_TEMP/legacy-loader.out"
            exit 1
          fi
          grep -q "Unsigned BPF loading" "$RUNNER_TEMP/legacy-loader.out"
      - run: go test ./...
      - name: Prove all three TPM crash windows without skips
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -v ./internal/server -run '^TestTPMRoot(Crash|CounterAhead)' -count=1 | tee "$RUNNER_TEMP/tpm-crash-proof.log"
          test "$(grep -c '^--- PASS: TestTPMRoot' "$RUNNER_TEMP/tpm-crash-proof.log")" -eq 3
          if grep -q '^--- SKIP:' "$RUNNER_TEMP/tpm-crash-proof.log"; then
            exit 1
          fi
      - name: Prove TPM root device identity binding without skips
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -v ./internal/server -run TestTPMRootRejectsCopiedStateOnDifferentEndorsementIdentity -count=1 | tee "$RUNNER_TEMP/tpm-device-binding-proof.log"
          grep -q -- "--- PASS: TestTPMRootRejectsCopiedStateOnDifferentEndorsementIdentity" "$RUNNER_TEMP/tpm-device-binding-proof.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/tpm-device-binding-proof.log"; then
            exit 1
          fi

      - name: Prove TPM measured-boot root binding without skips
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -v ./internal/server -run TestTPMRootRejectsPermitAfterMeasuredBootPCRDrift -count=1 | tee "$RUNNER_TEMP/tpm-measured-boot-proof.log"
          grep -q -- "--- PASS: TestTPMRootRejectsPermitAfterMeasuredBootPCRDrift" "$RUNNER_TEMP/tpm-measured-boot-proof.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/tpm-measured-boot-proof.log"; then
            exit 1
          fi

      - name: Prove authorized TPM root migration without skips
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -v ./internal/server -run TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay -count=1 | tee "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/same_authority_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/measured_boot_mismatch_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/stale_remote_decision_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/freshness_extension_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/future_remote_decision_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/destination_generation_mismatch_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/expired_authorization_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/forged_authorization_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/wrong_destination_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/authorized_migration_succeeds" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/replay_rejected" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          grep -q -- "--- PASS: TestTPMRootAuthorizedMigrationPreservesExactAuthorityAndRejectsReplay/continuity_preserved" "$RUNNER_TEMP/tpm-root-migration-proof.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/tpm-root-migration-proof.log"; then
            exit 1
          fi

      - name: Prove TPM-backed recovery witness signer continuity without skips
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -v ./internal/kernelfabric \
            -run '^TestTPMRecoveryWitnessSignerPreservesIdentityAndCompletesProfiledRecovery$' \
            -count=1 | tee "$RUNNER_TEMP/tpm-recovery-witness-signer-proof.log"
          grep -q -- "--- PASS: TestTPMRecoveryWitnessSignerPreservesIdentityAndCompletesProfiledRecovery" \
            "$RUNNER_TEMP/tpm-recovery-witness-signer-proof.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/tpm-recovery-witness-signer-proof.log"; then
            exit 1
          fi

      - name: Prove TPM hardware receipt contract and reject non-device fallback
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -v ./internal/kernelfabric \
            -run 'TestTPM(RecoveryWitnessHardwareReceiptBindsDeviceAndLivePublicArea|HardwareIdentityEvidenceRejectsNonCharacterDevice)' \
            -count=1 | tee "$RUNNER_TEMP/tpm-hardware-receipt-contract.log"
          grep -q -- "--- PASS: TestTPMRecoveryWitnessHardwareReceiptBindsDeviceAndLivePublicArea" \
            "$RUNNER_TEMP/tpm-hardware-receipt-contract.log"
          grep -q -- "--- PASS: TestTPMHardwareIdentityEvidenceRejectsNonCharacterDevice" \
            "$RUNNER_TEMP/tpm-hardware-receipt-contract.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/tpm-hardware-receipt-contract.log"; then
            exit 1
          fi

      - name: Run moat falsification benchmark v1
        run: go run ./cmd/moatbench

  integration:
    runs-on: ubuntu-latest
    needs:
      - unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - name: Install KinD
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Build isolated witness images
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$RUNNER_TEMP/aegis-taint-recovery-witness" \
            ./cmd/aegis-taint-recovery-witness
          cat > "$RUNNER_TEMP/Dockerfile.recovery-witness" <<'EOF'
          FROM scratch
          COPY aegis-taint-recovery-witness /aegis-taint-recovery-witness
          ENTRYPOINT ["/aegis-taint-recovery-witness"]
          EOF
          docker build \
            -f "$RUNNER_TEMP/Dockerfile.recovery-witness" \
            -t aegis-taint-recovery-witness:ci \
            "$RUNNER_TEMP"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$RUNNER_TEMP/aegis-recovery-witness-signer" \
            ./cmd/aegis-recovery-witness-signer
          cat > "$RUNNER_TEMP/Dockerfile.recovery-witness-signer" <<'EOF'
          FROM scratch
          COPY aegis-recovery-witness-signer /aegis-recovery-witness-signer
          ENTRYPOINT ["/aegis-recovery-witness-signer"]
          EOF
          docker build \
            -f "$RUNNER_TEMP/Dockerfile.recovery-witness-signer" \
            -t aegis-recovery-witness-signer:ci \
            "$RUNNER_TEMP"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$RUNNER_TEMP/aegis-external-head-witness" \
            ./cmd/aegis-external-head-witness
          cat > "$RUNNER_TEMP/Dockerfile.external-head-witness" <<'EOF'
          FROM scratch
          COPY aegis-external-head-witness /aegis-external-head-witness
          ENTRYPOINT ["/aegis-external-head-witness"]
          EOF
          docker build \
            -f "$RUNNER_TEMP/Dockerfile.external-head-witness" \
            -t aegis-external-head-witness:ci \
            "$RUNNER_TEMP"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -o "$RUNNER_TEMP/aegis-external-head-witness-signer" \
            ./cmd/aegis-external-head-witness-signer
          cat > "$RUNNER_TEMP/Dockerfile.external-head-witness-signer" <<'EOF'
          FROM scratch
          COPY aegis-external-head-witness-signer /aegis-external-head-witness-signer
          ENTRYPOINT ["/aegis-external-head-witness-signer"]
          EOF
          docker build \
            -f "$RUNNER_TEMP/Dockerfile.external-head-witness-signer" \
            -t aegis-external-head-witness-signer:ci \
            "$RUNNER_TEMP"
      - name: Create isolated workload and witness control planes
        run: |
          KIND_IMAGE="kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95"
          "$(go env GOPATH)/bin/kind" create cluster \
            --name state-latch \
            --image "$KIND_IMAGE" \
            --kubeconfig "$RUNNER_TEMP/workload-admin-kubeconfig"
          cat > "$RUNNER_TEMP/witness-kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30443
                  hostPort: 30443
                  protocol: TCP
                - containerPort: 30444
                  hostPort: 30444
                  protocol: TCP
                - containerPort: 30445
                  hostPort: 30445
                  protocol: TCP
                - containerPort: 30446
                  hostPort: 30446
                  protocol: TCP
                - containerPort: 30447
                  hostPort: 30447
                  protocol: TCP
          EOF
          "$(go env GOPATH)/bin/kind" create cluster \
            --name aegis-witness \
            --image "$KIND_IMAGE" \
            --config "$RUNNER_TEMP/witness-kind.yaml" \
            --kubeconfig "$RUNNER_TEMP/witness-admin-kubeconfig"
          "$(go env GOPATH)/bin/kind" load docker-image \
            --name aegis-witness \
            aegis-taint-recovery-witness:ci
          "$(go env GOPATH)/bin/kind" load docker-image \
            --name aegis-witness \
            aegis-recovery-witness-signer:ci
          "$(go env GOPATH)/bin/kind" load docker-image \
            --name aegis-witness \
            aegis-external-head-witness:ci
          "$(go env GOPATH)/bin/kind" load docker-image \
            --name aegis-witness \
            aegis-external-head-witness-signer:ci
      - name: Run baseline KinD integration suite
        env:
          KUBECONFIG: ${{ runner.temp }}/workload-admin-kubeconfig
        run: go test -tags=integration -run "^TestKind" -v ./internal/kubeadapter ./internal/server ./internal/journal
      - name: Create external profile authority custody material
        env:
          PROFILE_AUTHORITY_MODE: generate
          PROFILE_AUTHORITY_PRIVATE_KEY_PATH: ${{ runner.temp }}/profile-authority/private-key
          PROFILE_AUTHORITY_PUBLIC_KEY_PATH: ${{ runner.temp }}/profile-authority/public-key
        run: go run ./cmd/aegis-profile-authority
      - name: Create external B signer custody material
        env:
          WITNESS_SIGNER_CUSTODY_MODE: generate
          WITNESS_SIGNER_PRIVATE_KEY_PATH: ${{ runner.temp }}/witness-signer/private-key
          WITNESS_SIGNER_ALGORITHM_PATH: ${{ runner.temp }}/witness-signer/algorithm
          WITNESS_SIGNER_PUBLIC_KEY_PATH: ${{ runner.temp }}/witness-signer/public-key
          WITNESS_SIGNER_TLS_CERT_PATH: ${{ runner.temp }}/witness-signer/tls.crt
          WITNESS_SIGNER_TLS_KEY_PATH: ${{ runner.temp }}/witness-signer/tls.key
          WITNESS_SIGNER_ENDPOINT_PATH: ${{ runner.temp }}/witness-signer/endpoint
          WITNESS_SIGNER_TLS_SERVER_NAME_PATH: ${{ runner.temp }}/witness-signer/server-name
        run: go run ./cmd/aegis-recovery-witness-signer-custody
      - name: Create external-head signer custody material
        env:
          HEAD_WITNESS_SIGNER_CUSTODY_MODE: generate
          HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH: ${{ runner.temp }}/head-witness-signer/private-key
          HEAD_WITNESS_SIGNER_PUBLIC_KEY_PATH: ${{ runner.temp }}/head-witness-signer/public-key
          HEAD_WITNESS_SIGNER_TLS_CERT_PATH: ${{ runner.temp }}/head-witness-signer/tls.crt
          HEAD_WITNESS_SIGNER_TLS_KEY_PATH: ${{ runner.temp }}/head-witness-signer/tls.key
          HEAD_WITNESS_SIGNER_ENDPOINT_PATH: ${{ runner.temp }}/head-witness-signer/endpoint
          HEAD_WITNESS_SIGNER_TLS_SERVER_NAME_PATH: ${{ runner.temp }}/head-witness-signer/server-name
        run: go run ./cmd/aegis-external-head-witness-signer-custody
      - name: Install B signer custody service and remove local private material
        env:
          WITNESS_SIGNER_CUSTODY_MODE: install
          WITNESS_ADMIN_KUBECONFIG: ${{ runner.temp }}/witness-admin-kubeconfig
          WITNESS_SIGNER_PRIVATE_KEY_PATH: ${{ runner.temp }}/witness-signer/private-key
          WITNESS_SIGNER_TLS_CERT_PATH: ${{ runner.temp }}/witness-signer/tls.crt
          WITNESS_SIGNER_TLS_KEY_PATH: ${{ runner.temp }}/witness-signer/tls.key
        run: |
          go run ./cmd/aegis-recovery-witness-signer-custody
          rm -f "$WITNESS_SIGNER_PRIVATE_KEY_PATH"
          rm -f "$WITNESS_SIGNER_TLS_KEY_PATH"
          test ! -e "$WITNESS_SIGNER_PRIVATE_KEY_PATH"
          test ! -e "$WITNESS_SIGNER_TLS_KEY_PATH"
      - name: Install external-head signer custody and remove local private material
        env:
          HEAD_WITNESS_SIGNER_CUSTODY_MODE: install
          WITNESS_ADMIN_KUBECONFIG: ${{ runner.temp }}/witness-admin-kubeconfig
          HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH: ${{ runner.temp }}/head-witness-signer/private-key
          HEAD_WITNESS_SIGNER_TLS_CERT_PATH: ${{ runner.temp }}/head-witness-signer/tls.crt
          HEAD_WITNESS_SIGNER_TLS_KEY_PATH: ${{ runner.temp }}/head-witness-signer/tls.key
        run: |
          go run ./cmd/aegis-external-head-witness-signer-custody
          rm -f "$HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH"
          rm -f "$HEAD_WITNESS_SIGNER_TLS_KEY_PATH"
          test ! -e "$HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH"
          test ! -e "$HEAD_WITNESS_SIGNER_TLS_KEY_PATH"
      - name: Prepare witness activation request with public signer material only
        env:
          PROVISION_PHASE: prepare
          PROFILE_AUTHORITY_PUBLIC_KEY_PATH: ${{ runner.temp }}/profile-authority/public-key
          WITNESS_SIGNER_ALGORITHM_PATH: ${{ runner.temp }}/witness-signer/algorithm
          WITNESS_SIGNER_PUBLIC_KEY_PATH: ${{ runner.temp }}/witness-signer/public-key
          WITNESS_SIGNER_ENDPOINT_PATH: ${{ runner.temp }}/witness-signer/endpoint
          WITNESS_SIGNER_TLS_CERT_PATH: ${{ runner.temp }}/witness-signer/tls.crt
          WITNESS_SIGNER_TLS_SERVER_NAME_PATH: ${{ runner.temp }}/witness-signer/server-name
          WITNESS_SIGNER_PRIVATE_KEY_PATH: ${{ runner.temp }}/witness-signer/private-key
          TAINT_RECOVERY_PREPARED_BUNDLE: ${{ runner.temp }}/taint-recovery-prepared-bundle.json
          UNSIGNED_WITNESS_PROFILE_PATH: ${{ runner.temp }}/unsigned-witness-profile.json
        run: |
          test ! -z "$PROFILE_AUTHORITY_PUBLIC_KEY_PATH"
          test ! -e "$WITNESS_SIGNER_PRIVATE_KEY_PATH"
          go run ./cmd/aegis-capability-runtime-provision
          test -s "$TAINT_RECOVERY_PREPARED_BUNDLE"
          test -s "$UNSIGNED_WITNESS_PROFILE_PATH"
      - name: Sign witness profile in external authority step
        env:
          PROFILE_AUTHORITY_MODE: sign
          PROFILE_AUTHORITY_PRIVATE_KEY_PATH: ${{ runner.temp }}/profile-authority/private-key
          UNSIGNED_WITNESS_PROFILE_PATH: ${{ runner.temp }}/unsigned-witness-profile.json
          SIGNED_WITNESS_PROFILE_PATH: ${{ runner.temp }}/signed-witness-profile.json
        run: |
          go run ./cmd/aegis-profile-authority
          test -s "$SIGNED_WITNESS_PROFILE_PATH"
          rm -f "$PROFILE_AUTHORITY_PRIVATE_KEY_PATH"
          test ! -e "$PROFILE_AUTHORITY_PRIVATE_KEY_PATH"
      - name: Activate narrow runtime capabilities without profile authority private key
        env:
          PROVISION_PHASE: activate
          WORKLOAD_ADMIN_KUBECONFIG: ${{ runner.temp }}/workload-admin-kubeconfig
          WITNESS_ADMIN_KUBECONFIG: ${{ runner.temp }}/witness-admin-kubeconfig
          WORKLOAD_RUNTIME_KUBECONFIG: ${{ runner.temp }}/workload-runtime-kubeconfig
          WITNESS_RUNTIME_KUBECONFIG: ${{ runner.temp }}/witness-runtime-kubeconfig
          TAINT_RECOVERY_CONTROLLER_BUNDLE: ${{ runner.temp }}/taint-recovery-controller-bundle.json
          EXTERNAL_HEAD_WITNESS_CLIENT_BUNDLE: ${{ runner.temp }}/external-head-witness-client.json
          HEAD_WITNESS_SIGNER_PUBLIC_KEY_PATH: ${{ runner.temp }}/head-witness-signer/public-key
          HEAD_WITNESS_SIGNER_ENDPOINT_PATH: ${{ runner.temp }}/head-witness-signer/endpoint
          HEAD_WITNESS_SIGNER_TLS_CERT_PATH: ${{ runner.temp }}/head-witness-signer/tls.crt
          HEAD_WITNESS_SIGNER_TLS_SERVER_NAME_PATH: ${{ runner.temp }}/head-witness-signer/server-name
          HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH: ${{ runner.temp }}/head-witness-signer/private-key
          TAINT_RECOVERY_PREPARED_BUNDLE: ${{ runner.temp }}/taint-recovery-prepared-bundle.json
          SIGNED_WITNESS_PROFILE_PATH: ${{ runner.temp }}/signed-witness-profile.json
          PROFILE_AUTHORITY_PRIVATE_KEY_PATH: ${{ runner.temp }}/profile-authority/private-key
        run: |
          test ! -e "$PROFILE_AUTHORITY_PRIVATE_KEY_PATH"
          test ! -e "$RUNNER_TEMP/witness-signer/private-key"
          test ! -e "$HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH"
          if grep -R "HEAD_WITNESS_SIGNING_KEY_PATH\|HEAD_WITNESS_SIGNER_PRIVATE_KEY_PATH" \
            cmd/aegis-external-head-witness cmd/aegis-capability-runtime-provision \
            --include='*.go' --exclude='*_test.go'; then
            echo "external-head witness runtime or Aegis activation still references raw signing key" >&2
            exit 1
          fi
          if grep -R "WITNESS_PRIVATE_KEY_PATH\|witness-private-key" cmd/aegis-taint-recovery-witness cmd/aegis-capability-runtime-provision --include='*.go' --exclude='*_test.go'; then
            echo "B runtime or Aegis activation still references raw B signing key" >&2
            exit 1
          fi
          if find cmd/aegis-capability-runtime-provision \
            -name '*.go' ! -name '*_test.go' -print0 \
            | xargs -0 grep -n "SignExternalRecoveryWitnessProfile"; then
            echo "activation production source contains profile self-signing path" >&2
            exit 1
          fi
          go run ./cmd/aegis-capability-runtime-provision
          LIVE_QUORUM_CLIENT_BUNDLE="$RUNNER_TEMP/live-quorum-client.json" \
          LIVE_QUORUM_CHAOS_KUBECONFIG="$RUNNER_TEMP/live-quorum-chaos-kubeconfig" \
            go run ./cmd/aegis-live-quorum-provision
      - name: Remove provisioning authority
        run: |
          rm -f "$RUNNER_TEMP/workload-admin-kubeconfig"
          rm -f "$RUNNER_TEMP/witness-admin-kubeconfig"
          rm -rf "$HOME/.kube"
          test ! -e "$RUNNER_TEMP/workload-admin-kubeconfig"
          test ! -e "$RUNNER_TEMP/witness-admin-kubeconfig"
          test -s "$RUNNER_TEMP/workload-runtime-kubeconfig"
          test -s "$RUNNER_TEMP/witness-runtime-kubeconfig"
          test -s "$RUNNER_TEMP/taint-recovery-controller-bundle.json"
          test -s "$RUNNER_TEMP/external-head-witness-client.json"
          test -s "$RUNNER_TEMP/live-quorum-client.json"
          test -s "$RUNNER_TEMP/live-quorum-chaos-kubeconfig"
          test ! -e "$RUNNER_TEMP/head-witness-signer/private-key"
          test ! -e "$RUNNER_TEMP/head-witness-signer/tls.key"
          echo "KUBECONFIG=$RUNNER_TEMP/workload-runtime-kubeconfig" >> "$GITHUB_ENV"
          echo "WITNESS_KUBECONFIG=$RUNNER_TEMP/witness-runtime-kubeconfig" >> "$GITHUB_ENV"
          echo "TAINT_RECOVERY_CONTROLLER_BUNDLE=$RUNNER_TEMP/taint-recovery-controller-bundle.json" >> "$GITHUB_ENV"
          echo "EXTERNAL_HEAD_WITNESS_CLIENT_BUNDLE=$RUNNER_TEMP/external-head-witness-client.json" >> "$GITHUB_ENV"
          echo "LIVE_QUORUM_CLIENT_BUNDLE=$RUNNER_TEMP/live-quorum-client.json" >> "$GITHUB_ENV"
          echo "LIVE_QUORUM_CHAOS_KUBECONFIG=$RUNNER_TEMP/live-quorum-chaos-kubeconfig" >> "$GITHUB_ENV"
          echo "TAINT_RECOVERY_WITNESS_ENDPOINT=https://127.0.0.1:30443" >> "$GITHUB_ENV"
      - name: Run cross-cluster witness proof without admin credentials
        run: go test -tags=integration -run "^TestKindCrossClusterWitnessRejectsWorkloadAuthorityRollback$" -v ./internal/server
      - name: Prove live 2-of-3 external head quorum
        run: |
          set -o pipefail
          go test -tags=integration \
            -run "^TestKindLiveTwoOfThreeExternalHeadQuorum$" \
            -count=1 -v ./internal/server \
            | tee "$RUNNER_TEMP/live-2of3-quorum.log"
          grep -q -- "--- PASS: TestKindLiveTwoOfThreeExternalHeadQuorum" \
            "$RUNNER_TEMP/live-2of3-quorum.log"
          if grep -q -- "--- SKIP:" "$RUNNER_TEMP/live-2of3-quorum.log"; then
            exit 1
          fi
      - name: Prove recovery witness control-plane separation without admin credentials
        run: |
          set -o pipefail
          go test -tags=integration \
            -run "^TestKindTaintRecoveryWitnessControlPlaneSeparation$" \
            -count=1 -v ./internal/server \
            | tee "$RUNNER_TEMP/taint-recovery-witness-separation.log"
          grep -q -- "--- PASS: TestKindTaintRecoveryWitnessControlPlaneSeparation" \
