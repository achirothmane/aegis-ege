name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    needs:
      - unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - name: Install KinD
        run: go install sigs.k8s.io/kind@v0.33.0
      - name: Create KinD cluster
        run: |
          "$(go env GOPATH)/bin/kind" create cluster --name state-latch --image "kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95"
          "$(go env GOPATH)/bin/kind" get kubeconfig --name state-latch > "$RUNNER_TEMP/state-latch-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/state-latch-kubeconfig" >> "$GITHUB_ENV"
      - name: Run KinD integration tests
        run: go test -tags=integration -run "^TestKind" -v ./internal/kubeadapter
