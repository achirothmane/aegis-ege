name: EEP Live Validation

on:
  workflow_dispatch:
    inputs:
      confirm_live_mutation:
        description: "I understand this run will perform one real external CRM mutation"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eep-live-validation
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.confirm_live_mutation }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EEP_N8N_WEBHOOK_URL: ${{ secrets.EEP_N8N_WEBHOOK_URL }}
      EEP_N8N_AUTH_TOKEN: ${{ secrets.EEP_N8N_AUTH_TOKEN }}
      EEP_SOURCE_PRINCIPAL: ${{ secrets.EEP_SOURCE_PRINCIPAL }}
      EEP_CRM_BASE_URL: ${{ secrets.EEP_CRM_BASE_URL }}
      EEP_CRM_DESTINATION_ID: ${{ secrets.EEP_CRM_DESTINATION_ID }}
      EEP_CRM_ACCOUNT_ID: ${{ secrets.EEP_CRM_ACCOUNT_ID }}
      EEP_CRM_EXPECTED_RESOURCE_VERSION: ${{ secrets.EEP_CRM_EXPECTED_RESOURCE_VERSION }}
      EEP_CRM_BEARER_TOKEN: ${{ secrets.EEP_CRM_BEARER_TOKEN }}
      EEP_PATCH_JSON: ${{ secrets.EEP_PATCH_JSON }}
      EEP_N8N_TRIGGER_JSON: ${{ secrets.EEP_N8N_TRIGGER_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - run: go mod download
      - run: go mod verify
      - name: Re-run local safety suite
        run: go test ./...
      - name: Execute one live evidence-gated mutation
        run: go run ./cmd/eep-live-validate
