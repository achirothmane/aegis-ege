[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-governed-kernel-prototype"
version = "0.1.0"
description = "Executable local reference kernel for bounded governed actions"
requires-python = ">=3.12"
dependencies = ["cryptography==46.0.0"]

[project.scripts]
astra-kernel = "astra_kernel.cli:main"

[tool.setuptools.packages.find]
include = ["astra_kernel*"]
